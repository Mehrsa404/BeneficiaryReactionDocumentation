              paths:
                - path: /
                  pathType: Prefix
    configmap:
      autoConfig: true
      env:
        MSSE.AM_ConsulAccessToken: "08913506-ee60-d8cb-8400-23bd2227b635"
        MSSE.AM_ConsulConfigurationDirectoryPath: "alpha/portal/external/StarConfig"
        MSSE.AM_ConsulServerAddress: "http://192.168.92.82:8500"
        MSSE.AM_UseConsul: "true"

  external-portal-star-web:
    enabled: true
    microserviceGroup: EXTERNAL-PORTAL-STAR-WEB
    replicaCount: 1
    image:
      name: "web-403.1"
      repository: repo.mohaymen.ir:8082/starrelease
    service:
      type: ClusterIP
      port: 80
      containerPort: 8080
    ingresses:
      - enabled: true
        ingress:
          className: nginx
          hosts:
            - host: portal-star-web-nta.alpha.nta.local
              paths:
                - path: /
                  pathType: Prefix
    resources:
      requests:
        cpu: "200m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "768Mi"
    configmap:
      autoConfig: true
      env: {}
      config:
        nginx.conf: |-
          worker_processes 1;
          pid /tmp/nginx.pid;
          events {
              worker_connections 1024;
          }

          http {
              include mime.types;
              sendfile on;
              keepalive_timeout 650;

              access_log /dev/stdout;
              error_log /dev/stderr warn;

              map $remote_addr $proxy_forwarded_elem {
                  # IPv4 addresses can be sent as-is
                  ~^[0-9.]+$          "for=$remote_addr";

                  # IPv6 addresses need to be bracketed and quoted
                  ~^[0-9A-Fa-f:.]+$   "for=\"[$remote_addr]\"";

                  # Unix domain socket names cannot be represented in RFC 7239 syntax
                  default             "for=unknown";
              }

              map $http_forwarded $proxy_add_forwarded {
                  # If the incoming Forwarded header is syntactically valid, append to it
                  "~^(,[ \\t]*)*([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?(;([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?)*([ \\t]*,([ \\t]*([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?(;([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?)*)?)*$" "$http_forwarded, $proxy_forwarded_elem";

                  # Otherwise, replace it
                  default "$proxy_forwarded_elem";
              }

              map $http_upgrade $proxy_connection {
                  default upgrade;
                  "" close;
              }

              map $http_host $this_host {
                  "" $host;
                  default $http_host;
              }

              map $http_x_forwarded_host $the_host {
                  default $http_x_forwarded_host;
                  "" $this_host;
              }

              server {
                  absolute_redirect off;
                  resolver kube-dns.kube-system.svc.cluster.local;
                  listen 8080 default_server;
                  listen [::]:8080 default_server;
                  root /opt/output;

                  add_header 'Access-Control-Allow-Origin' * always;
                  add_header 'Access-Control-Allow-Credentials' 'true' always;
                  add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                  add_header 'Access-Control-Allow-Headers' 'Accept,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Requested-With' always;

                  proxy_hide_header X-Req-Permission-UserId;
                  proxy_hide_header X-Req-Permission-TargerSystemId;
                  proxy_hide_header X-Req-Permission-TargerSystemPassword;

                  location ~ bundles/assets/languages/languages-path-files.json {
                      add_header Last-Modified $date_gmt;
                      add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
                      if_modified_since off;
                      etag off;
                      expires -1;
                  }

                  location ~ web.uiconfign {
                      add_header Last-Modified $date_gmt;
                      add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
                      if_modified_since off;
                      etag off;
                      expires -1;
                  }

                  location ~ virtual-directory-config.js {
                      add_header Last-Modified $date_gmt;
                      add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
                      if_modified_since off;
                      etag off;
                      expires -1;
                  }

                  location ~ AllLanguages.js {
                      add_header Last-Modified $date_gmt;
                      add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
                      if_modified_since off;
                      etag off;
                      expires -1;
                  }


                  location ~ customization {
                      add_header Last-Modified $date_gmt;
                      add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
                      if_modified_since off;
                      etag off;
                      expires -1;
                  }

                  set $SERVER_AM_URL "http://external-portal-star-am-svc.portal.svc.cluster.local";
                  set $SERVER_DIA_URL "http://external-portal-star-dia-svc.portal.svc.cluster.local";
                  set $HTTP_X-Req-Permission-UserId "";

                  proxy_http_version 1.1;
                  client_header_buffer_size 1024k;
                  large_client_header_buffers 4 1024k;

                  location ~ [.]html$ {
                      add_header Last-Modified $date_gmt;
                      add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
                      if_modified_since off;
                      etag off;
                      expires -1;
                  }

                  location ~ gateway/MSSE.AM/(.*) {
                      proxy_pass $SERVER_AM_URL/$1$is_args$query_string;
                      proxy_set_header Forwarded "$proxy_add_forwarded;proto=$scheme";
                  }              
          
                  location ~ gateway/MSSE.DIA/(.*) {
                      proxy_pass $SERVER_DIA_URL/$1$is_args$query_string ;
                      proxy_set_header Forwarded "$proxy_add_forwarded;proto=$scheme";
                  }
          
                  rewrite .+/virtual-directory-config.js$ /virtual-directory-config.js redirect;
                  rewrite ^/assets/monaco-editor/(.*) /bundles/assets/monaco-editor/$1 permanent;

                  location / {
                      try_files $uri /bundles/index.html;
                  }
              }
          }

