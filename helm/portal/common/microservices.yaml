microservices:
  internal-portal-front:
    enabled: true
    microserviceGroup: INTERNAL-PORTAL-FRONT
    replicaCount: 1
    image:
      repository: repo.nta.local:8084
      name: "depna/front.portal"
      pullPolicy: IfNotPresent
    configmap:
      autoConfig: true
      env: { }
      config:
        env.js: |
          window.env = {
            "VITE_BASENAME": "کارتابل ادارات",
            "VITE_TITLE": ".::کارتابل ادارات مالیاتی::.",
            "VITE_IS_HTTPS": "0",
            "VITE_DEFAULT_LANGUAGE": "fa",
            "VITE_TEXT_FOOTER": "© کليه حقوق اين سامانه متعلق به سازمان امور مالياتی کشور می‌باشد. ویرایش 4.1",
            "VITE_LINK_FOOTER": "",
            "VITE_APIURL": "/portal-gateway",
            "VITE_GRAPHQLURL": "/portal-gateway",
            "VITE_WSURL": "/portal-gateway",
            "VITE_MINI_KASRA_APP": "http://taxreturn.master.nta.local:7727",
            "VITE_DEBUG_APIURL": "/portal-gateway",
            "VITE_AUTH": "/auth/graphql",
            "VITE_PORTAL": "/portal/graphql",
            "VITE_BAM": "/bam/graphql",
            "VITE_MANAGEMENT": "/management/graphql",
            "VITE_CASE": "/case/graphql",
            "VITE_FORM": "/form/graphql",
            "VITE_AUTH_REST": "/auth/rest",
            "VITE_PORTAL_REST": "/portal/rest",
            "VITE_BAM_REST": "/bam/rest",
            "VITE_MANAGEMENT_REST": "/management/rest",
            "VITE_CASE_REST": "/case/rest",
            "VITE_UPLOAD_REST": "/upload/rest",
            "VITE_AVATAR": "/management/rest/api/v1/user/avatar",
            "VITE_SENDER_AVATAR": "/management/rest/api/v1/user/senderavatar",
            "VITE_JOB_LENGTH": "null",
            "VITE_PRIMARY_COLOR": "#1f9e56",
            "VITE_NAVBAR_TYPE": "floating",
            "VITE_LOGIN_MODE": "DEFAULT",
            "VITE_REMEMBER_PATH": "0"
          }
        fileMounts:
          - fileName: env.js
            mountPath: /usr/share/nginx/html/env.js
    secrets:
      - name: internal-portal-front-logo-secret
        data:
          logo.png: 
      - name: internal-portal-front-favicon-secret
        data:
          favicon.ico: 
    extraVolumeMounts:
      - name: internal-portal-front-logo-volume
        mountPath: /usr/share/nginx/html/logo.png
        subPath: logo.png
      - name: internal-portal-front-favicon-volume
        mountPath: /usr/share/nginx/html/favicon.ico
        subPath: favicon.ico
    extraVolumes:
      - name: internal-portal-front-logo-volume
        secret:
          secretName: internal-portal-front-logo-secret
      - name: internal-portal-front-favicon-volume
        secret:
          secretName: internal-portal-front-favicon-secret
    service:
      type: ClusterIP
      port: 80
      targetPort: 8080

