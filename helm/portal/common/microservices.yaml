    readinessProbe:
      httpGet:
        path: "/api/health"
        port: 58081
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 5
      timeoutSeconds: 5
    livenessProbe:
      httpGet:
        path: "/api/health"
        port: 58081
      initialDelaySeconds: 600
      periodSeconds: 60
      failureThreshold: 10
      timeoutSeconds: 10
    service:
