  external-portal-star-am:
    enabled: true
    microserviceGroup: EXTERNAL-PORTAL-STAR-AM
    replicaCount: 1
    image:
      name: "am-403.1"
      repository: repo.mohaymen.ir:8082/starrelease
    resources:
      requests:
        cpu: "200m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "768Mi"
